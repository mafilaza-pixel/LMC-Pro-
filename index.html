
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>LMC Pro</title>
<style>
:root {
  --bg:#050505;
  --panel:#111111;
  --yellow:#ffd400;
  --text:#ffffff;
  --muted:#999999;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,select,input { font:inherit; }
button { cursor:pointer; }
.app {
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:78px;
}
.topbar {
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:#090909;
  border-bottom:1px solid #222;
}
.topbar button {
  color:white;
  background:transparent;
  border:0;
  padding:10px;
}
.active-text { color:var(--yellow)!important; }
.preview {
  height:48vh;
  min-height:280px;
  max-height:480px;
  margin:8px;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(160deg,#164a7c,#3479b7,#111b27);
  display:flex;
  align-items:center;
  justify-content:center;
}
#video {
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}
.preview-message {
  position:absolute;
  text-align:center;
  padding:18px;
  color:white;
  text-shadow:0 1px 4px #000;
}
.preview-message .lens { font-size:56px; }
.grid-lines {
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,transparent 33%,#ffffff33 33.3%,transparent 33.7%,transparent 66%,#ffffff33 66.3%,transparent 66.7%),
    linear-gradient(transparent 33%,#ffffff33 33.3%,transparent 33.7%,transparent 66%,#ffffff33 66.3%,transparent 66.7%);
  display:none;
}
.controls {
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:10px 4px;
}
.round-btn {
  background:#1b1b1b;
  color:white;
  border:1px solid #444;
  border-radius:50%;
  width:44px;
  height:44px;
}
.yellow-btn {
  background:var(--yellow);
  color:black;
  border:0;
  border-radius:24px;
  padding:12px 18px;
  font-weight:bold;
}
.shutter {
  width:70px;
  height:70px;
  border:4px solid white;
  border-radius:50%;
  background:var(--yellow);
  box-shadow:inset 0 0 0 4px #111;
}
.zoom {
  color:var(--yellow);
  background:#222;
  border:0;
  border-radius:20px;
  padding:8px 14px;
}
.mode-row,.nav-row {
  display:flex;
  justify-content:space-around;
  gap:4px;
  padding:8px 4px;
}
.mode-row button,.nav-row button {
  flex:1;
  color:#ddd;
  background:transparent;
  border:0;
  padding:10px 2px;
  border-radius:10px;
  font-size:12px;
}
.mode-row button.active,.nav-row button.active {
  color:var(--yellow);
  background:#292400;
}
.section {
  display:none;
  padding:14px;
}
.section.active { display:block; }
.section h2 {
  font-size:20px;
  margin:4px 0 16px;
}
.card {
  background:var(--panel);
  border:1px solid #252525;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}
.row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #292929;
}
.row:last-child { border-bottom:0; }
.row small { color:var(--muted); }
input[type="range"] {
  accent-color:var(--yellow);
  width:100%;
}
select {
  color:white;
  background:#222;
  border:1px solid #444;
  border-radius:8px;
  padding:8px;
  max-width:150px;
}
.note {
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.filter-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.filter-item {
  padding:14px 3px;
  background:#202020;
  border:1px solid #333;
  color:white;
  border-radius:10px;
}
.filter-item.selected {
  border:2px solid var(--yellow);
  color:var(--yellow);
}
.bottom-nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  background:#0d0d0d;
  border-top:1px solid #292929;
  display:flex;
  justify-content:space-around;
  padding:8px 2px;
  z-index:10;
}
.bottom-nav button {
  background:transparent;
  color:#aaa;
  border:0;
  font-size:11px;
  padding:6px 4px;
}
.bottom-nav button.active { color:var(--yellow); }
</style>
</head>
<body>
<div class="app">

<header class="topbar">
  <button id="flashBtn">⚡</button>
  <button id="hdrBtn">HDR+</button>
  <button id="aiTop" class="active-text">✨ AI</button>
  <button onclick="showSection('settings')">⚙️</button>
</header>

<div id="cameraSection" class="section active">
  <div class="preview" id="preview">
    <video id="video" autoplay playsinline></video>
    <div class="preview-message" id="previewMessage">
      <div class="lens">📷</div>
      <strong>LMC Pro</strong>
      <p>Caméra professionnelle</p>
      <small>Appuie sur le bouton caméra pour démarrer</small>
    </div>
    <div class="grid-lines" id="gridLines"></div>
  </div>

  <div class="controls">
    <button class="round-btn" id="switchBtn">🔄</button>
    <button class="zoom" id="zoom1">1×</button>
    <button class="zoom" id="zoom2">2×</button>
    <button class="round-btn" id="startCamera">📷</button>
  </div>

  <div class="mode-row" id="modeRow">
    <button data-mode="Nuit">🌙 Nuit</button>
    <button data-mode="Portrait">👤 Portrait</button>
    <button data-mode="Photo" class="active">📸 Photo</button>
    <button data-mode="Vidéo">🎥 Vidéo</button>
    <button data-mode="Plus">＋ Plus</button>
  </div>

  <div class="controls">
    <button class="round-btn" onclick="showSection('gallery')">🖼️</button>
    <button class="shutter" id="shutterBtn" aria-label="Prendre une photo"></button>
    <button class="round-btn" id="recordBtn">⏺</button>
  </div>
</div>

<!-- Ampahany manaraka: filtres, AI, Pro, galerie ary réglages -->

</div>
</body>
</html>
